name: azure-login-test
on:
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request the GitHub OIDC token
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Show the subject Azure must trust
        run: echo "repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:ref:${{ github.ref }}"

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prove access
        run: |
          az account show --query "{subscription:name, tenant:tenantId}" -o table
          az group show -n rg-cw2-mlops --query "{resourceGroup:name, location:location}" -o table
