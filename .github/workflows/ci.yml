name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit, data and model tests (pytest)
        run: pytest
